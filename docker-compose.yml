# Bazar.com - exactly three containers: catalog, order, frontend.
services:
  catalog:
    build:
      context: ./src/CatalogService
    container_name: catalog
    environment:
      - CatalogFilePath=/app/data/catalog.csv
    ports:
      - "4000:4000"
    volumes:
      - catalog-data:/app/data      # catalog.csv survives container restarts
    networks:
      - bazar-net

  order:
    build:
      context: ./src/OrderService
    container_name: order
    environment:
      - CATALOG_URL=http://catalog:4000
      - OrdersFilePath=/app/data/orders.csv
    ports:
      - "3000:3000"
    volumes:
      - order-data:/app/data        # orders.csv survives container restarts
    depends_on:
      - catalog
    networks:
      - bazar-net

  frontend:
    build:
      context: ./src/FrontendService
    container_name: frontend
    environment:
      - CATALOG_URL=http://catalog:4000
      - ORDER_URL=http://order:3000
    ports:
      - "5000:5000"
    depends_on:
      - catalog
      - order
    networks:
      - bazar-net

volumes:
  catalog-data:
  order-data:

networks:
  bazar-net:
    driver: bridge
